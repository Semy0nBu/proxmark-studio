<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title description">
  <title id="title">Proxmark Studio</title>
  <desc id="description">An HF and LF workspace for Windows, using the RRG and Iceman client.</desc>
  <rect width="1120" height="240" rx="22" fill="#20252d"/>
  <path d="M765 0v240" stroke="#354151" stroke-width="1"/>
